name: PROOF Orchestrator CI/CD
on:
  push:
    branches:
      - test_ci
    tags:
      - 'v*'

jobs:
  build:
    if: github.ref_type != 'tag' && !startsWith(github.event.head_commit.message, 'WIP')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      - run: mvn clean compile test