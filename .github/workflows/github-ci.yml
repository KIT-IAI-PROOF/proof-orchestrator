name: PROOF Orchestrator CI/CD
on:
  push:
    branches:
      - test_ci
    tags:
      - 'v*'
env:
  GITHUB_TOKEN: ${{ secrets.PROOF_PACKAGE_CI_TOKEN }}
jobs:
  build:
    if: github.ref_type != 'tag' && !startsWith(github.event.head_commit.message, 'WIP')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
          server-id: 'github-proof'
          server-password: GITHUB_TOKEN
      - run: mvn clean compile test